name: Deploy Flatplan to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify application
        run: |
          node --check public/app.js
          npm test
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
